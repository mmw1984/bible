[versions]
# Toolchain. AGP 9 has built-in Kotlin support and rejects applying
# `org.jetbrains.kotlin.android` explicitly, so Android modules take Kotlin from AGP itself and
# only the non-Android Kotlin plugins (jvm/compose/serialization) are declared here.
# Those plugins must stay on exactly the KGP that AGP ships, otherwise the Compose compiler
# plugin and the Kotlin compiler drift apart and the build stops compiling.
# AGP 9.1.0 has a runtime dependency on kotlin-gradle-plugin 2.2.10 and pairs it with KSP
# 2.2.10-2.0.2; AGP silently raises any lower KSP to that pair. `kotlin` and `ksp` below are
# therefore pinned to AGP's own pair rather than to the newest release on Maven. The 2.2.10 line
# has exactly one KSP release, so this pin cannot be moved forward on its own: KSP only gained
# AGP 9 built-in Kotlin support in 2.2.21-2.0.5 / 2.3.4+, which need a newer Kotlin. Until AGP
# and Kotlin move up together, `android.disallowKotlinSourceSets=false` in gradle.properties
# suppresses the kotlin.sourceSets error that KSP 2.0.2 still triggers (google/ksp#2729).
# AGP 9.1.0 is the floor for compileSdk 37: Compose 1.12.1 and androidx.hilt 1.4.0 both
# declare minCompileSdk=37 in their AAR metadata, so the whole toolchain moves up together.
# AGP 9.1.0 declares GRADLE_MIN_VERSION 9.3.1 (see gradle/wrapper/gradle-wrapper.properties).
agp = "9.1.0"
kotlin = "2.2.10" # KGP built into AGP 9.1.0
ksp = "2.2.10-2.0.2" # the KSP release AGP pairs with KGP 2.2.10
jdk = "17"

# DI. 2.59 was pinned only because 2.59.1+ requires AGP 9; now that we are on AGP 9.1.0
# we take the current release instead.
hilt = "2.60.1"
androidxHilt = "1.4.0"

# AndroidX
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
room = "2.8.5"
datastore = "1.2.1"
securityCrypto = "1.1.0"
coreSplashscreen = "1.2.0"
webkit = "1.17.1"
browser = "1.10.0"
media3 = "1.11.1"

# Kotlin ecosystem
coroutines = "1.11.0"
serialization = "1.11.0"
javaxInject = "1"

# Network / parsing
okhttp = "5.5.0"
retrofit = "3.0.0"
coil = "3.6.3"
jsoup = "1.23.2"

# Test
junit = "5.14.4"
mockk = "1.14.11"
turbine = "1.2.1"

# Static analysis
detekt = "1.23.8"
ktlintGradle = "14.2.0"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }

androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }