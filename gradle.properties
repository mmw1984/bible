# Bible native Android build configuration (see NATIVE_PLAN.md §2.3 / §5).

# Daemon JVM: Room/KSP/Hilt all run inside the daemon, keep headroom.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Every module gets its own R class; no transitive resource leakage across modules.
android.nonTransitiveRClass=true
# Resource ids are not final at compile time, so library switches (locale/dark mode
# qualifiers, split resources) keep working at runtime.
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
# Room / Hilt schema export dirs are set per module in build.gradle.kts.
ksp.incremental=true

# AGP 9 built-in Kotlin rejects Kotlin sources registered through the `kotlin.sourceSets` DSL,
# which is exactly how KSP hands its generated sources (build/generated/ksp/<variant>/kotlin) to
# the compiler, so configuration fails with "Using kotlin.sourceSets DSL to add Kotlin sources is
# not allowed with built-in Kotlin" (google/ksp#2729). KSP only learned to register through the
# new `android.sourceSets`/variant API in 2.2.21-2.0.5 and 2.3.4+, and both need a newer Kotlin
# than the 2.2.10 that AGP 9.1.0 bundles. The 2.2.10 line never got another KSP release, so there
# is no version to upgrade to without moving AGP and Kotlin together (see the toolchain note in
# gradle/libs.versions.toml). This is the escape hatch AGP documents for the error, and the one
# google/ksp#2729 confirms works. Drop it once AGP and Kotlin move up to a native pair.
android.disallowKotlinSourceSets=false
