# Bible native Android build configuration (see NATIVE_PLAN.md §2.3 / §5).

# Daemon JVM: Room/KSP/Hilt all run inside the daemon, keep headroom.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Every module gets its own R class; no transitive resource leakage across modules.
android.nonTransitiveRClass=true
# Resource ids are not final at compile time, so library switches (locale/dark mode
# qualifiers, split resources) keep working at runtime.
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
# Room / Hilt schema export dirs are set per module in build.gradle.kts.
ksp.incremental=true