<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="一個安靜、專注、現代的雙語聖經閱讀空間。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bible">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>Bible</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #090909; }
    #app-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f1efe9;
      font: 500 14px system-ui, sans-serif;
      letter-spacing: 0;
      transition: opacity 180ms ease;
    }
    #app-loading span { opacity: .72; }
    #app-loading.ready { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app-loading" role="status"><span>Bible</span></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const loading = document.getElementById('app-loading');
      if (!loading) return;
      loading.classList.add('ready');
      setTimeout(() => loading.remove(), 200);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
