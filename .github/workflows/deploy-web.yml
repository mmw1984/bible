name: Deploy Web

# Builds the Flutter web bundle here and ships a prebuilt static output to
# Vercel, so neither Vercel git hooks nor local machines run `flutter build`.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  # Matches .vercel/project.json (not a secret — IDs only).
  VERCEL_ORG_ID: team_nm3NfXeO1Y5lrSNMFTd86cgc
  VERCEL_PROJECT_ID: prj_oCiZoeG30dtjGW1dGkx7SDsrfix2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze

      - name: Build web
        run: flutter build web --release

      - name: Assemble Vercel prebuilt output
        run: |
          mkdir -p .vercel/output/static
          cp -a build/web/. .vercel/output/static/
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "^/.*$", "dest": "/index.html" },
              { "handle": "error" },
              { "status": 404, "src": "^(?!/api).*$", "dest": "/404.html" }
            ],
            "crons": []
          }
          EOF

      - name: Deploy prebuilt to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not set — skipping deploy." >&2
            exit 1
          fi
          npx --yes vercel@latest deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
