name: Release APK

# Release gate for the native (Kotlin/Compose) app — NATIVE_PLAN.md §5 Phase 6.
# This workflow replaces the Flutter build: `:app:assembleRelease` produces the
# installable APK, `:app:bundleRelease` the Play bundle, and both are published
# under the same `bible-<version>-release.*` names the Flutter workflow used, so
# release assets and their `.sha256` sidecars stay the same shape for users.
#
# Deliberately minimal (Marco's cut scope): unit tests, then build, then the
# checksum + size gate. ktlint / detekt / lintDebug are NOT repeated here — they
# are deferred to their own phase and already gate every push to this branch
# through android-ci.yml (which, unlike this workflow, does not fire on tags).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 for the same reason android-ci.yml uses it: Paparazzi draws the
      # feature/reader, feature/library and feature/navigation goldens from
      # variants that declare org.gradle.jvm.version = 21, and the unit tests
      # below run them.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk 37 ships as the minor-versioned platform `android-37.0` (there
      # is no bare `android-37` package) and the runner image does not carry it.
      # Build-tools are auto-downloaded by AGP.
      - name: Install Android SDK Platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # NATIVE_PLAN.md §3.4 item 6: the two ARB key sets have to stay identical and
      # the generated strings have to stay in sync with them. Cheap, and it fails
      # on a mismatch before anything is signed.
      - name: l10n resources in sync
        run: node tool/arb_to_strings.mjs --check

      - name: Unit tests
        run: ./gradlew test --stacktrace

      # ANDROID_KEYSTORE_* are read from the environment by `app/build.gradle.kts`
      # while it configures, so they have to be on the step that starts Gradle
      # (NATIVE_PLAN.md §6 R2). Same secrets, same keystore and alias as the
      # Flutter build ever used, which is what makes the native release install
      # over the existing app without uninstalling.
      - name: Build release APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      # versionName lives in `app/build.gradle.kts` now, not in a pubspec. Match
      # only the bare defaultConfig assignment (8 spaces of indent) so a
      # versionCode/versionName pair cannot resolve the wrong line, and refuse to
      # guess if the format ever moves.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          mapfile -t versions < <(grep -E '^        versionName = "[^"]+"$' app/build.gradle.kts \
            | sed -E 's/.*versionName = "([^"]+)"/\1/')
          if [ "${#versions[@]}" -ne 1 ]; then
            echo "expected exactly one versionName in app/build.gradle.kts, found ${#versions[@]}" >&2
            exit 1
          fi
          echo "version=${versions[0]}" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mv app/build/outputs/apk/release/app-release.apk "bible-${VERSION}-release.apk"
          mv app/build/outputs/bundle/release/app-release.aab "bible-${VERSION}-release.aab"

      - name: Checksum artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum "bible-${VERSION}-release.apk" | tee "bible-${VERSION}-release.apk.sha256"
          sha256sum "bible-${VERSION}-release.aab" | tee "bible-${VERSION}-release.aab.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Bible ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bible-*-release.apk
            bible-*-release.apk.sha256
            bible-*-release.aab
            bible-*-release.aab.sha256