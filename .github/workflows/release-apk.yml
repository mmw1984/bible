name: Release APK

# Release gate for the native (Kotlin/Compose) app — NATIVE_PLAN.md §5 Phase 6.
# This workflow replaces the Flutter build: `:app:assembleRelease` produces the
# installable APK, `:app:bundleRelease` the Play bundle, and both are published
# under the same `bible-<version>-release.*` names the Flutter workflow used, so
# release assets and their `.sha256` sidecars stay the same shape for users.
#
# Deliberately minimal (Marco's cut scope): unit tests, then build, then the
# checksum + size gate. ktlint / detekt / lintDebug are NOT repeated here — they
# are deferred to their own phase and already gate every push to this branch
# through android-ci.yml (which, unlike this workflow, does not fire on tags).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 for the same reason android-ci.yml uses it: Paparazzi draws the
      # feature/reader, feature/library and feature/navigation goldens from
      # variants that declare org.gradle.jvm.version = 21, and the unit tests
      # below run them.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk 37 ships as the minor-versioned platform `android-37.0` (there
      # is no bare `android-37` package) and the runner image does not carry it.
      # Build-tools are auto-downloaded by AGP.
      - name: Install Android SDK Platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # NATIVE_PLAN.md §3.4 item 6: the two ARB key sets have to stay identical and
      # the generated strings have to stay in sync with them. Cheap, and it fails
      # on a mismatch before anything is signed.
      - name: l10n resources in sync
        run: node tool/arb_to_strings.mjs --check

      - name: Unit tests
        run: ./gradlew test --stacktrace

      # versionName lives in `app/build.gradle.kts` now, not in a pubspec. Match
      # only the bare defaultConfig assignment (8 spaces of indent) so a
      # versionCode/versionName pair cannot resolve the wrong line, and refuse to
      # guess if the format ever moves.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          mapfile -t versions < <(grep -E '^        versionName = "[^"]+"$' app/build.gradle.kts \
            | sed -E 's/.*versionName = "([^"]+)"/\1/')
          if [ "${#versions[@]}" -ne 1 ]; then
            echo "expected exactly one versionName in app/build.gradle.kts, found ${#versions[@]}" >&2
            exit 1
          fi
          echo "version=${versions[0]}" >> "$GITHUB_OUTPUT"

      # ANDROID_KEYSTORE_* are read from the environment by `app/build.gradle.kts`
      # while it configures, so they have to be on the step that starts Gradle
      # (NATIVE_PLAN.md §6 R2). Same secrets, same keystore and alias as the
      # Flutter build ever used, which is what makes the native release install
      # over the existing app without uninstalling. REQUIRE_RELEASE_SIGNING tells
      # the build to fail rather than fall back to the debug key if they are absent.
      - name: Build release APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: 'true'
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      # Rename before anything inspects or digests the artifacts, so that every step below works
      # from one path and, more to the point, `apksigner` reads the file under the exact name the
      # release publishes. `mv` does not touch the bytes, so the certificate below is still the
      # certificate of the APK that ships — there is just no window in which the check has to guess
      # at the pre-rename path.
      - name: Rename artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mv app/build/outputs/apk/release/app-release.apk "bible-${VERSION}-release.apk"
          mv app/build/outputs/bundle/release/app-release.aab "bible-${VERSION}-release.aab"

      # NATIVE_PLAN.md §6 R2, checked instead of assumed: `signingReport` shows what the release
      # variant actually resolved to (a fall back to debug prints `Config: debug`), and apksigner
      # shows what certificate the finished APK carries. Only public certificate digests are read
      # and printed here — no secret is passed to either command, and the keystore vars are needed
      # again because the release signing config only exists when they are present.
      - name: Verify release certificate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: 'true'
        run: |
          set -euo pipefail
          report=$(./gradlew --console=plain :app:signingReport)
          # Only the release block: the report repeats these fields per variant, and the next
          # "Variant:" line ends it.
          release_variant=$(awk '/^Variant: release$/ { found = 1; next } /^Variant:/ { found = 0 } found' <<<"$report")
          config=$(sed -n 's/^Config:[[:space:]]*//p' <<<"$release_variant")
          alias=$(sed -n 's/^Alias:[[:space:]]*//p' <<<"$release_variant")
          # Colons stripped because the report has been printed both ways across AGP versions.
          store_digest=$(sed -n 's/^SHA-256:[[:space:]]*//p' <<<"$release_variant" | tr -d ':')
          if [ "$config" != "release" ] || [ -z "$alias" ] || [ -z "$store_digest" ]; then
            echo "release variant resolved to config='$config' alias='$alias'; expected the release keystore" >&2
            exit 1
          fi

          # AGP downloaded the build-tools the release build just used, so apksigner is on disk.
          apksigner=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs "bible-${VERSION}-release.apk")
          mapfile -t apk_digests < <(grep -o 'certificate SHA-256 digest: .*' <<<"$certs" | awk '{ print $NF }')
          if [ "${#apk_digests[@]}" -ne 1 ]; then
            echo "expected the APK to carry exactly one signing certificate, found ${#apk_digests[@]}" >&2
            exit 1
          fi
          # apksigner prints the digest base64-encoded, signingReport prints it as hex.
          apk_digest=$(python3 -c 'import base64, sys; print(base64.b64decode(sys.argv[1]).hex().upper())' \
            "${apk_digests[0]}")
          if [ "$apk_digest" != "$store_digest" ]; then
            echo "APK certificate $apk_digest does not match the release keystore certificate $store_digest" >&2
            exit 1
          fi
          echo "release APK signed by the release keystore (alias $alias, cert $apk_digest)"

      # NATIVE_PLAN.md §5 Phase 6 (R10): the release carries an 8.7 MB Bible database and
      # ~4.6 MB of fonts on top of Compose + Hilt, so the size is a budget, not an
      # accident. 40 MiB is the ceiling (fail), 25 MiB the target (warn only) — both in
      # MiB, because that is what the on-disk numbers and the download manager count.
      # The AAB is held to the same numbers as the APK: it is the same dex, resources
      # and assets in a container, so one budget covers both. Nothing here shrinks the
      # app; R8 and asset packing are a later phase, and until then this gate reports
      # the floor rather than the best case.
      - name: Size gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          readonly CEILING_MIB=40
          readonly TARGET_MIB=25
          status=0
          summary=""
          for artifact in "bible-${VERSION}-release.apk" "bible-${VERSION}-release.aab"; do
            bytes=$(stat -c %s "$artifact")
            mib=$(((bytes + 524287) / 1048576))
            echo "${artifact}: ${mib} MiB"
            summary+="- ${artifact}: ${mib} MiB (ceiling ${CEILING_MIB} MiB)"$'\n'
            if ((mib > CEILING_MIB)); then
              echo "::error::${artifact} is ${mib} MiB, over the ${CEILING_MIB} MiB release ceiling"
              status=1
            elif ((mib > TARGET_MIB)); then
              echo "::warning::${artifact} is ${mib} MiB, over the ${TARGET_MIB} MiB target"
            fi
          done
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '## Release size\n\n%s' "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Checksum artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum "bible-${VERSION}-release.apk" | tee "bible-${VERSION}-release.apk.sha256"
          sha256sum "bible-${VERSION}-release.aab" | tee "bible-${VERSION}-release.aab.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Bible ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bible-*-release.apk
            bible-*-release.apk.sha256
            bible-*-release.aab
            bible-*-release.aab.sha256