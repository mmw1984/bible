name: Android CI

# Native (Kotlin/Compose) build checks for NATIVE_PLAN.md §5 Phase 0.
# The Flutter app keeps building from `legacy/flutter/` through release-apk.yml,
# which stays untouched until Phase 6.
on:
  push:
    branches:
      - main
      - native-android
    paths-ignore:
      - 'legacy/flutter/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'legacy/flutter/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ktlint + detekt + unitTest + lintDebug + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: detekt
        run: ./gradlew detekt --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bible-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error